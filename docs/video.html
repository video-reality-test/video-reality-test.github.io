<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI vs Real Video Test (Sound On)</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #000;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 664px; 
            height: 400px;
            text-align: center;
        }

        .video-stage {
            display: flex;
            justify-content: center;
            gap: 4px;
            width: 100%;
            height: 100%;
        }

        .video-box {
            position: relative;
            width: 330px;
            height: 400px;
            background-color: #111;
            border-radius: 8px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.4;
            transition: opacity 0.5s ease;
        }

        video.active {
            opacity: 1; 
        }

        /* --- 修改开始：修复闪烁问题的核心 CSS --- */
        #intro-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 20; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            
            /* 关键修改：显示时瞬间出现，不加动画，防止看到底下视频切换 */
            opacity: 1;
            transition: none; 
            font-size: 30px;  /*这里改大！默认大约是32px，建议改成 60px 或 80px */
            font-weight: bold;
            letter-spacing: 2px; /* 字间距，可选 */
            text-shadow: 0 0 10px rgba(255,255,255,0.5); /* 发光效果，可选 */
        }
        
        #intro-overlay.hidden {
            opacity: 0;
            pointer-events: none;
            
            /* 关键修改：只在消失时才慢慢淡出 */
            transition: opacity 0.5s ease;
        }
        /* --- 修改结束 --- */

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .result-label {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            padding: 8px 25px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            border-radius: 50px;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .result-label.real { background-color: rgba(40, 167, 69, 0.9); }
        .result-label.ai { background-color: rgba(220, 53, 69, 0.9); }

        .show-result .result-label {
            transform: translateX(-50%) scale(1);
            opacity: 1;
        }
    </style>
</head>
<body>

<div id="game-container">
    
    <div id="start-screen" onclick="unlockAudioAndStart()">
        <h1 style="color:#fff;">点击屏幕开始<br><span style="font-size:16px; font-weight:normal; color:#888;">(Click to Start with Sound)</span></h1>
    </div>

    <div id="intro-overlay" class="hidden">
        <h1>Real or AI?</h1>
    </div>

    <div class="video-stage">
        <div class="video-box" id="box-left">
            <video id="vid-left" playsinline></video>
            <div class="result-label real">Real</div>
        </div>

        <div class="video-box" id="box-right">
            <video id="vid-right" playsinline></video>
            <div class="result-label ai">AI</div>
        </div>
    </div>
</div>

<script>
    const videoPairs = [
        { left: './static/videos/demo_pair/easy/pair 2/real.mp4', right: './static/videos/demo_pair/easy/pair 2/video2_bread.mp4' },
        { left: './static/videos/demo_pair/easy/pair 3/real.mp4', right: './static/videos/demo_pair/easy/pair 3/video2_sandwich.mp4' },
        { left: './static/videos/demo_pair/easy/pair7/real.mp4', right: './static/videos/demo_pair/easy/pair7/ASMR_切西红柿_视频生成_veo.mp4' },
        { left: './static/videos/demo_pair/easy/pair8/real.mp4', right: './static/videos/demo_pair/easy/pair8/kling_video1_veg.mp4' },
        { left: './static/videos/demo_pair/hard/pair 1/real.mp4', right: './static/videos/demo_pair/hard/pair 1/veo3.1.mp4' },
        { left: './static/videos/demo_pair/hard/pair 4/real.mp4', right: './static/videos/demo_pair/hard/pair 4/7.mp4' },
        { left: './static/videos/demo_pair/hard/pair 5/real.mp4', right: './static/videos/demo_pair/hard/pair 5/16.mp4' },
        { left: './static/videos/demo_pair/hard/pair 6/real.mp4', right: './static/videos/demo_pair/hard/pair 6/32.mp4' }
    ];

    const TIME_INTRO_DISPLAY = 1500;
    const TIME_RESULT_DISPLAY = 1500;

    let currentIndex = 0;
    
    const startScreen = document.getElementById('start-screen');
    const introOverlay = document.getElementById('intro-overlay');
    const vidLeft = document.getElementById('vid-left');
    const vidRight = document.getElementById('vid-right');
    const boxLeft = document.getElementById('box-left');
    const boxRight = document.getElementById('box-right');

    function unlockAudioAndStart() {
        startScreen.style.display = 'none';
        vidLeft.play().then(() => vidLeft.pause()).catch(()=>{});
        vidRight.play().then(() => vidRight.pause()).catch(()=>{});
        runSequence();
    }

    function runSequence() {
        resetUI();
        loadVideoSource(currentIndex);

        introOverlay.classList.remove('hidden');
        
        setTimeout(() => {
            introOverlay.classList.add('hidden');
            playLeftVideo();
        }, TIME_INTRO_DISPLAY);
    }

    function loadVideoSource(index) {
        if (index >= videoPairs.length) index = 0;
        vidLeft.src = videoPairs[index].left;
        vidRight.src = videoPairs[index].right;
        
        vidLeft.volume = 1.0; 
        vidRight.volume = 1.0;
        
        vidLeft.load();
        vidRight.load();
    }

    function playLeftVideo() {
        vidLeft.classList.add('active');
        vidLeft.currentTime = 0;
        vidLeft.play().catch(e => console.error("播放失败", e));

        vidLeft.onended = () => {
            vidLeft.classList.remove('active');
            playRightVideo();
        };
    }

    function playRightVideo() {
        vidRight.classList.add('active');
        vidRight.currentTime = 0;
        vidRight.play().catch(e => console.error("播放失败", e));

        vidRight.onended = () => {
            vidRight.classList.remove('active');
            showAnswersAndNext();
        };
    }

    function showAnswersAndNext() {
        boxLeft.classList.add('show-result');
        boxRight.classList.add('show-result');

        setTimeout(() => {
            currentIndex++;
            if (currentIndex >= videoPairs.length) {
                currentIndex = 0;
            }
            runSequence();
        }, TIME_RESULT_DISPLAY);
    }

    function resetUI() {
        boxLeft.classList.remove('show-result');
        boxRight.classList.remove('show-result');
        vidLeft.classList.remove('active');
        vidRight.classList.remove('active');
    }
</script>

</body>
</html>
